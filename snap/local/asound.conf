# Strict confinement has no access to the host's ALSA config or hardware
# devices, so route ALSA clients (e.g. Java's sound API used by RuneLite and
# HDOS) through PulseAudio, which the audio-playback plug grants.
pcm.!default {
  type pulse
  fallback "sysdefault"
}
ctl.!default {
  type pulse
  fallback "sysdefault"
}
