name: bolt-runescape-launcher
title: Bolt Launcher (unofficial snap)
base: core26
version: '0.24.0'
grade: stable
confinement: strict
license: AGPL-3.0-only
summary: Unofficial snap of Bolt, a free-software third-party game launcher
description: |
  Bolt is a third-party, free-software launcher for RuneScape and Old School
  RuneScape. It downloads and runs the unmodified game clients (RS3, the
  official OSRS client via Wine, RuneLite and HDOS). Bolt is not a game client
  and cannot modify or automate gameplay.

  **This snap is unofficial.** It is packaged and maintained independently of
  the Bolt project. Please report every problem with this snap to the snap's
  issue tracker:

    https://github.com/mattkae/bolt-runescape-launcher-snap/issues

  Do **not** report snap problems to the Bolt developers. Only go upstream if
  you have built that same Bolt version from source yourself, outside of the
  snap, and reproduced the problem there.

  Bundled for convenience: Java 21 (RuneLite, HDOS), Wine (official OSRS
  client) and the Bolt plugin library.

  Bolt is an unofficial project and is not affiliated with any of the games
  or companies it interacts with.
contact: https://github.com/mattkae/bolt-runescape-launcher-snap/issues
issues: https://github.com/mattkae/bolt-runescape-launcher-snap/issues
source-code: https://github.com/mattkae/bolt-runescape-launcher-snap
website: https://github.com/mattkae/bolt-runescape-launcher-snap

platforms:
  amd64:

apps:
  bolt-runescape-launcher:
    command: bin/bolt-launcher-wrapper
    desktop: usr/share/applications/bolt-launcher.desktop
    common-id: bolt-launcher
    extensions: [gnome]
    environment:
      JAVA_HOME: $SNAP/usr/lib/jvm/java-21-openjdk-amd64
      PATH: $SNAP/wine/bin:$SNAP/usr/lib/jvm/java-21-openjdk-amd64/bin:$PATH
    plugs:
      - audio-playback
      - browser-sandbox
      - desktop
      - desktop-legacy
      - home
      - joystick
      - network
      - network-bind
      - opengl
      - screen-inhibit-control
      - shm
      - wayland
      - x11

plugs:
  browser-sandbox:
    interface: browser-support
    allow-sandbox: true
  # Bolt and its plugin library use POSIX shared memory named /bolt-*, which
  # strict confinement only allows inside a private /dev/shm.
  shm:
    interface: shared-memory
    private: true

parts:
  cef:
    plugin: dump
    source: https://adamcake.com/cef/cef-139.0.7258.139-linux-x86_64-minimal-ungoogled.tar.xz
    source-checksum: sha256/aeb98ff1f621c8f7c5f0be6c34acefaf4fe4be763004a9d2a9e933d1cd914650
    organize:
      '*': cef-dist/
    prime:
      - -*

  # The RS3 client links against OpenSSL 1.1, which Ubuntu no longer ships.
  openssl1-1:
    plugin: nil
    source: https://github.com/openssl/openssl.git
    source-tag: OpenSSL_1_1_1w
    source-depth: 1
    build-packages:
      - zlib1g-dev
    override-build: |
      # GCC 15 defaults to C23, which OpenSSL 1.1 predates
      CFLAGS="${CFLAGS:-} -std=gnu17" ./config --prefix=/usr --openssldir=/usr/lib/ssl shared zlib
      make -j"${CRAFT_PARALLEL_BUILD_COUNT}"
      install -d "${CRAFT_PART_INSTALL}/usr/lib/openssl-1.1"
      install -m644 libssl.so.1.1 libcrypto.so.1.1 "${CRAFT_PART_INSTALL}/usr/lib/openssl-1.1/"

  bolt:
    after: [cef]
    plugin: cmake
    source: https://codeberg.org/Adamcake/Bolt.git
    source-tag: '0.24.0'
    source-submodules:
      - modules/fmt
      - modules/hashmap
      - modules/spng
    cmake-generator: Ninja
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/
      - -DCEF_ROOT=${CRAFT_STAGE}/cef-dist
      - -DBOLT_META_NAME=bolt-launcher
      - -DBOLT_CEF_INSTALLDIR=opt
      - -DBOLT_BINDIR=bin
      - -DBOLT_LIBDIR=lib
      - -DBOLT_SHAREDIR=usr/share
    build-packages:
      - g++
      - ninja-build
      - pkgconf
      - libarchive-dev
      - libluajit-5.1-dev
      - libx11-dev
      - libxcb1-dev
    stage-packages:
      - libarchive13t64
      - libluajit-5.1-2
      # Chromium Embedded Framework runtime
      - libasound2t64
      - libatk-bridge2.0-0t64
      - libatk1.0-0t64
      - libcups2t64
      - libdbus-1-3
      - libnspr4
      - libnss3
      - libxcomposite1
      - libxdamage1
      - libxkbcommon0
      - libxrandr2
      - libxshmfence1
    override-build: |
      craftctl default
      desktop="${CRAFT_PART_INSTALL}/usr/share/applications/bolt-launcher.desktop"
      sed -i \
        -e 's|^Exec=.*|Exec=bolt-launcher|' \
        -e 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/bolt-launcher.svg|' \
        -e 's|^Name=.*|Name=Bolt Launcher (snap)|' \
        "${desktop}"
      # Only the launcher's desktop entry is useful; the extra NoDisplay entry
      # and appstream data refer to upstream's own packaging.
      rm -f "${CRAFT_PART_INSTALL}"/usr/share/applications/bolt-launcher.*.desktop
      rm -rf "${CRAFT_PART_INSTALL}/usr/share/metainfo"
      # bolt-run.sh expects to live next to opt/, our wrapper replaces it
      rm -f "${CRAFT_PART_INSTALL}/bin/bolt"

  # Runtime libraries for the RS3 Linux client, which Bolt downloads at runtime.
  rs3-client-deps:
    plugin: nil
    stage-packages:
      - libcap2-bin
      - libegl1
      - libgtk2.0-0t64
      - libopengl0
      - libsdl2-2.0-0
      - libsm6
      - libxxf86vm1
      - zlib1g

  # Java for RuneLite and HDOS
  jre:
    plugin: nil
    stage-packages:
      - openjdk-21-jre
    build-packages:
      # ca-certificates-java only generates its trust store when a JVM is
      # present, so the build host needs one too
      - ca-certificates-java
      - openjdk-21-jre-headless
    override-build: |
      craftctl default
      # ca-certificates-java generates the Java trust store in a postinst
      # script, which never runs for stage-packages. Ship the build host's copy
      # instead of a dangling symlink into the host's /etc.
      if [ ! -s /etc/ssl/certs/java/cacerts ]; then
        update-ca-certificates --fresh
      fi
      cacerts="${CRAFT_PART_INSTALL}/usr/lib/jvm/java-21-openjdk-amd64/lib/security/cacerts"
      rm -f "${cacerts}"
      install -m644 /etc/ssl/certs/java/cacerts "${cacerts}"

  # Wine for the official OSRS client (pure 64-bit wow64 build, no i386 libs)
  wine:
    plugin: dump
    source: https://github.com/Kron4ek/Wine-Builds/releases/download/11.1/wine-11.1-staging-amd64-wow64.tar.xz
    source-checksum: sha256/65d83e5ea0fb71cc88c54e19b7d694eeba67fc25dad73a38e58acd90de9e2f5b
    organize:
      '*': wine/
    stage:
      - -wine/include
      - -wine/lib/wine/*/*.a
    stage-packages:
      - libfontconfig1
      - libfreetype6
      - libgnutls30t64
      - libpulse0
      - libunwind8
      - libvulkan1
      - libxcursor1
      - libxext6
      - libxfixes3
      - libxi6
      - libxinerama1
      - libxrender1

  wrapper:
    plugin: dump
    source: snap/local
    organize:
      bolt-launcher-wrapper: bin/bolt-launcher-wrapper
